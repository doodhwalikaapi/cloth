<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Offers</title><link rel="stylesheet" href="style.css">
<script>
var offers = {
  1: "BUY ONE GET ONE FREE on Men's Round Neck Tees - use code BOGO1",
  2: "Flat 30% OFF on all Women's Tops - use code WOMEN30",
  3: "FREE delivery on orders above Rs. 999 - applied automatically",
  4: "Extra 10% OFF for students (show college ID) - use code STUDENT10",
  5: "Combo: Any 3 T-shirts for Rs. 1299 - use code COMBO3"
};
function showOffer(n) {
  document.getElementById('msg').innerHTML = "&#127873; " + offers[n];
}
</script></head>
<body class="bottom">
<marquee behavior="scroll" direction="left" scrollamount="6" onmouseover="this.stop()" onmouseout="this.start()">
  &#127881; BUY ONE GET ONE FREE on Men's Round Neck Tees! &nbsp;&nbsp;&bull;&nbsp;&nbsp; Flat 30% OFF on Women's Tops! &nbsp;&nbsp;&bull;&nbsp;&nbsp; Free delivery above Rs. 999! &nbsp;&nbsp;&bull;&nbsp;&nbsp; Students get extra 10% OFF! &nbsp;&nbsp;&bull;&nbsp;&nbsp; Any 3 T-shirts for Rs. 1299! &#127881;
</marquee>
<div class="chips">
  <b>Click an offer:</b>
  <button onclick="showOffer(1)">BOGO</button>
  <button onclick="showOffer(2)">30% Off Tops</button>
  <button onclick="showOffer(3)">Free Delivery</button>
  <button onclick="showOffer(4)">Student Offer</button>
  <button onclick="showOffer(5)">3-Tee Combo</button>
</div>
<div id="msg">Hover on the scrolling text to pause it, or click an offer button to see its code.</div>
</body></html>
